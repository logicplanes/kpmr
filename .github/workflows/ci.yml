name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  comments:
    name: No comments
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Source files contain no comments
        run: |
          found=0
          git grep -nP '^\s*(//|/\*|\*/|\{/\*)' -- '*.ts' '*.tsx' '*.js' '*.mjs' '*.json' '*.css' && found=1
          git grep -nP '\S\s+//|[;{},)\]]//|\{/\*' -- '*.ts' '*.tsx' '*.js' '*.mjs' && found=1
          git grep -nP '\S\s+/\*[^"\x27`]*$' -- '*.ts' '*.tsx' '*.js' '*.mjs' '*.css' && found=1
          git grep -nP '<!--' -- '*.html' && found=1
          git grep -nP '^\s*<!--' -- '*.md' && found=1
          git grep -nP '^\s*#(?![!\[])' -- '*.yml' '*.yaml' '*.sh' '*Dockerfile*' '*.dockerignore' '*.gitignore' '*.prettierignore' && found=1
          git grep -nP '\S\s+#(?=[\s\w])' -- '*.yml' '*.yaml' '*.sh' '*Dockerfile*' '*.dockerignore' && found=1
          if [[ "$found" -ne 0 ]]; then
            echo "::error::Remove the comments listed above. Code explains itself through names, types and tests."
            exit 1
          fi

      - name: Code blocks in Markdown contain no comments
        run: |
          node --input-type=commonjs <<'SCRIPT'
            const { execFileSync } = require("node:child_process");
            const { readFileSync } = require("node:fs");
            const files = execFileSync("git", ["ls-files", "--", "*.md"], { encoding: "utf8" }).split("\n").filter(Boolean);
            const hashed = ["sh", "bash", "shell", "console", "yaml", "yml", "dockerfile", ""];
            let found = 0;
            for (const file of files) {
              let lang = null;
              readFileSync(file, "utf8").split("\n").forEach((line, i) => {
                const fence = /^\s*```(\w*)/.exec(line);
                if (fence) {
                  lang = lang === null ? fence[1] : null;
                  return;
                }
                if (lang === null) return;
                if ((hashed.includes(lang) && /^\s*#(?!!)/.test(line)) || /^\s*(\/\/|\/\*|<!--)/.test(line)) {
                  console.log(`${file}:${i + 1}: ${line}`);
                  found = 1;
                }
              });
            }
            if (found) {
              console.log("::error::Remove the comments listed above from the code blocks.");
              process.exit(1);
            }
          SCRIPT

  lint:
    name: Lint, format and types
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck

  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm build
      - run: pnpm licenses:check

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          load: true
          push: false
          tags: kpmr:ci
          cache-from: type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=ci

  ci:
    name: CI
    if: always()
    needs: [comments, lint, test, build, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [[ "$result" != "success" ]]; then
              echo "::error::A job did not pass: $RESULTS"
              exit 1
            fi
          done
