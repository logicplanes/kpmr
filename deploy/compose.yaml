name: kpmr

services:
  kpmr:
    image: kpmr:${KPMR_TAG:?run bin/kpmr-deploy}
    container_name: kpmr
    restart: unless-stopped
    read_only: true
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=16m,mode=1777"]
    mem_limit: 512m
    pids_limit: 64
    environment:
      KPMR_SIGNING_KEY_FILE: /run/secrets/kpmr-signing.pem
      KPMR_SIGNING_KEY_ID: kpmr-2026-10
    volumes:
      - ./data:/data
      - /opt/logicplanes/secrets/kpmr-signing.pem:/run/secrets/kpmr-signing.pem:ro
    networks: [logicplanes]
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    labels:
      traefik.enable: "true"
      traefik.docker.network: logicplanes
      traefik.http.routers.kpmr-web.entrypoints: web
      traefik.http.routers.kpmr-web.rule: Host(`kpmr.kaeso.app`) && !PathPrefix(`/.well-known/acme-challenge/`)
      traefik.http.routers.kpmr-web.middlewares: redirect-https@file
      traefik.http.routers.kpmr.entrypoints: websecure
      traefik.http.routers.kpmr.rule: Host(`kpmr.kaeso.app`)
      traefik.http.routers.kpmr.tls.certresolver: letsencrypt
      traefik.http.services.kpmr.loadbalancer.server.port: "8080"
      logicplanes.net.name: KPMR
      logicplanes.net.check-path: /healthz

networks:
  logicplanes:
    external: true
